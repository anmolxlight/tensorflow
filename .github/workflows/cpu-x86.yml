name: Ubuntu-CPU

on:
  pull_request:
    branches:
      - master
      - r2.**

permissions:
  contents: read

jobs:
  Ubuntu-CPU:
    if: github.repository == 'tensorflow/tensorflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: CPU presubmit
        shell: bash
        env:
          TFCI: py313,linux_x86
        run: ./ci/official/pycpp.sh
